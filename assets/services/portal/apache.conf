# mpd portal — Apache base vhost for mpd-service-portal.
#
# TEMPLATE: %%ZONE%% is substituted with this VM's DNS zone by
# Mpd.Service.Portal.setup(), which writes the rendered copy into
# <stateDir>/portal/apache.conf and bind-mounts that. Do not mount this
# file directly — ServerName must name the VM's own zone.
# Dynamic service proxy vhosts are generated into /etc/apache2/mpd-vhosts/*.conf.

<VirtualHost *:80>
    ServerName %%ZONE%%
    Redirect permanent / https://%%ZONE%%/
</VirtualHost>

<VirtualHost *:443>
    ServerName %%ZONE%%
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/mpd/cert.pem
    SSLCertificateKeyFile /etc/mpd/key.pem
    DirectoryIndex index.php
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

IncludeOptional /etc/apache2/mpd-vhosts/*.conf
