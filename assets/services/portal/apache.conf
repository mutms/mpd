# mpd portal — Apache base vhost for mpd-service-portal (10.163.0.4)
# Dynamic service proxy vhosts are generated into /etc/apache2/mpd-vhosts/*.conf.

<VirtualHost *:80>
    ServerName mpd.test
    Redirect permanent / https://mpd.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName mpd.test
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/mpd/cert.pem
    SSLCertificateKeyFile /etc/mpd/key.pem
    DirectoryIndex index.php
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

IncludeOptional /etc/apache2/mpd-vhosts/*.conf
