# dnsmasq.conf — DNS resolver for mpd.test
# This container runs at 10.163.0.3. The laptop reaches it via the static
# tunnel into the VM (or directly if the laptop is the VM, in the sandbox
# case where mpd lives entirely inside the VM).
#
# Name records are explicitly managed in /etc/dnsmasq.d/ by mpd:
# - services.conf for service hostnames (including mpd.test)
# - per-runtime/per-project records for runtime and project hostnames
# Unknown *.mpd.test names intentionally return NXDOMAIN (no wildcard fallback).

# Listen on all interfaces inside the container
interface=*

# Treat mpd.test as a local-only domain: never forward queries for this domain
# upstream. Unknown names return NXDOMAIN immediately. AAAA queries for names
# that have only A records return NoData immediately. Without this, AAAA queries
# for mpd.test would be forwarded to public DNS (.test TLD), which stalls for
# seconds and makes getaddrinfo (ping/getent/curl) appear hung even though the
# A record is fast.
local=/mpd.test/

# Upstream resolvers come from a bind-mounted view of the host's
# systemd-resolved-managed resolv.conf — i.e. the *real* per-link upstreams
# (corporate DNS on a VPN, the home router on Wi-Fi, etc.), not the
# 127.0.0.53 stub that /etc/resolv.conf points at. dnsmasq watches the
# file for changes, so when the laptop switches networks resolved updates
# the file and dnsmasq picks up the new upstream automatically without
# any restart. mpd bind-mounts /run/systemd/resolve/resolv.conf into the
# container at this path (see Mpd.Service.Dnsmasq.setup).
resolv-file=/etc/dnsmasq-host-resolv.conf

# Explicit records loaded from /etc/dnsmasq.d/ (services, databases).
conf-dir=/etc/dnsmasq.d/
