# Installed by mpd --vm-setup as /etc/cloud/cloud.cfg.d/99-mpd.cfg.
# Edits are overwritten.
#
# Once mpd is set up, cloud-init must leave the box alone: its identity
# is fixed (hostname mpd-<NNN>, the dev user, the SSH host keys mpd-virt
# pinned) and /etc/hosts holds mpd's DNS records. Proxmox hands out a new
# instance-id whenever its cloud-init tab is touched, so without this
# every "per instance" module would run again on the next boot — renaming
# the VM, re-creating the user and regenerating the host keys.
#
# Only the disk modules stay: enlarging the disk in the hypervisor still
# grows the filesystem. The network config is not a module and keeps
# applying, so fixing the IP in the hypervisor still works. A list in a
# cloud.cfg.d file replaces the one in cloud.cfg, and user-data never sets
# module lists, so this is final.
#
# A template or a fresh VM has no drop-in: its first boot runs everything.
cloud_init_modules:
 - growpart
 - resizefs
cloud_config_modules: []
cloud_final_modules: []
