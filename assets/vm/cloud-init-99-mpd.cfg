# Installed by mpd --vm-setup as /etc/cloud/cloud.cfg.d/99-mpd.cfg.
# Edits are overwritten.
#
# cloud-init must not rewrite /etc/hosts at boot: mpd keeps its DNS
# records there. This is the cloud_init_modules list from Debian trixie's
# cloud.cfg without update_etc_hosts. A list in a cloud.cfg.d file
# replaces the one in cloud.cfg, and the instance user-data never sets
# module lists, so this is final. (`manage_etc_hosts: false` here would
# not work: the user-data from the seed outranks this file.)
#
# Every other module keeps running: hostname, users, keys, and whatever
# the hypervisor's cloud-init config sets.
cloud_init_modules:
 - seed_random
 - bootcmd
 - write-files
 - growpart
 - resizefs
 - disk_setup
 - mounts
 - set_hostname
 - update_hostname
 - ca-certs
 - rsyslog
 - users-groups
 - ssh
